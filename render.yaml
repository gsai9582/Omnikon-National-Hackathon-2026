services:
  # 1. Frontend Static Site
  - type: web
    name: resqtrace-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: resqtrace-backend
          property: url

  # 2. Spring Boot Java Backend
  - type: web
    name: resqtrace-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: RESQTRACE_STORAGE_PROVIDER
        value: local
      - key: RESQTRACE_CORS_ALLOWED_ORIGINS
        value: "*"
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: resqtrace-ai
          property: host
      - key: JWT_SECRET
        generateValue: true
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

  # 3. Python FastAPI AI Service
  - type: web
    name: resqtrace-ai
    runtime: docker
    dockerfilePath: ./ai_service/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health

