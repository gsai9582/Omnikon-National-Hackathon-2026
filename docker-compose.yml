version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: resqtrace-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret_db_password}
      MYSQL_DATABASE: resqtrace
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai_service
    container_name: resqtrace-ai
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: resqtrace-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL:-jdbc:mysql://mysql:3306/resqtrace?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret_db_password}
      - JWT_SECRET=${JWT_SECRET:-a_very_long_secure_random_string_for_production_jwt_signing_which_should_be_at_least_256_bits}
      - AI_SERVICE_URL=http://ai-service:8000
      - RESQTRACE_STORAGE_PROVIDER=${RESQTRACE_STORAGE_PROVIDER:-local}
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: resqtrace-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  backend_uploads:
