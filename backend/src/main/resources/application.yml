spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:resqtrace;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: ${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBkZXZlbG9wbWVudCBwdXJwb3NlcyBvbmx5IGRvIG5vdCB1c2UgaW4gcHJvZHVjdGlvbg==}
  expiration: 86400000

server:
  port: ${PORT:${SERVER_PORT:8080}}

resqtrace:
  cors:
    allowed-origins: ${RESQTRACE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost,http://127.0.0.1:5173,http://127.0.0.1:80,http://127.0.0.1}
  priority:
    threshold-high: 80.0
    threshold-medium: 40.0
    weight-age-child: 30.0
    age-child-limit: 12
    weight-age-elderly: 20.0
    age-elderly-limit: 65
    weight-medical: 40.0
    weight-hours-missing: 1.0
    max-hours-counted: 48
